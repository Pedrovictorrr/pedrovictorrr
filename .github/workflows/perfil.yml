name: Escritório pixel art

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: [gerar.py]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 gerar.py --teste && python3 gerar.py
        env:
          # METRICS_TOKEN (PAT opcional) conta contribuições privadas; sem ele usa o token do Actions
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "codewave-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: atualiza escritório e stats" && git push)
